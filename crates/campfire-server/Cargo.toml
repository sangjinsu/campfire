[package]
name = "campfire-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Example Campfire multiplayer server with CLI, dashboard, and optional arena game"

[features]
default = ["arena"]
arena = ["dep:campfire-arena"]

[dependencies]
campfire-runtime = { path = "../campfire-runtime", version = "0.1.0" }
campfire-arena = { path = "../campfire-arena", version = "0.1.0", optional = true }
axum.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
getrandom.workspace = true
sha2.workspace = true
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
